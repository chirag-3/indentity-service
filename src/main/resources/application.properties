spring.application.name=identityservice

spring.datasource.url=jdbc:postgresql://localhost:5432/identity-service-v1
spring.datasource.username=postgres
spring.datasource.password=********
spring.datasource.driver-class-name=org.postgresql.Driver

# Turn OFF Hibernate schema mutation (critical when using Flyway)
spring.jpa.hibernate.ddl-auto=validate

# Flyway Settings (enabled by default when dependency is present)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true